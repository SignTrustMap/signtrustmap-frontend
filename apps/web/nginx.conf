server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Unified API Gateway Identification
    add_header X-Gateway-Proxied "signtrust-nginx-gateway" always;

    # Unified API Gateway Reverse Proxy Routes
    location /api/v1/ {
        proxy_pass https://api.signmap.site/api/v1/;
        proxy_set_header Host api.signmap.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /ai/ {
        proxy_pass https://ai.signmap.site/;
        proxy_set_header Host ai.signmap.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /storage/ {
        proxy_pass https://s3.signmap.site/;
        proxy_set_header Host s3.signmap.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
