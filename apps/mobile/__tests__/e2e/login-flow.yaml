appId: com.anonymous.mobile
---
# ==========================================
# Maestro E2E: Login Flow
# ==========================================

- launchApp:
    clearState: false

# Navigate to Login or launch root
- openLink: "mobile://login"

# 1. Tap on Email field
- tapOn:
    text: ".*Email.*"
    optional: true
- inputText: "test@signtrustmap.vn"
- hideKeyboard

# 2. Tap on Password field
- tapOn:
    text: ".*Mật khẩu.*"
    optional: true
- inputText: "Pass123456@"
- hideKeyboard
