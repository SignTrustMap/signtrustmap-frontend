name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - package.json
      - package-lock.json
      - .github/workflows/android-apk.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS
        working-directory: apps/mobile
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build-result.json

      - name: Download APK
        working-directory: apps/mobile
        run: |
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' build-result.json)

          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "Could not find APK download URL"
            exit 1
          fi

          curl --fail --location "$BUILD_URL" --output app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/app-release.apk
          retention-days: 14
