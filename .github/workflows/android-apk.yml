name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/android-apk.yml

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure ABI Splits
        run: |
          sed -i '/android {/a \    splits { abi { enable true; reset(); include "arm64-v8a", "armeabi-v7a", "x86_64"; universalApk false } }' apps/mobile/android/app/build.gradle

      - name: Build APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifacts
        run: |
          OUTPUT_DIR="apps/mobile/android/app/build/outputs/apk/release"
          cp "${OUTPUT_DIR}/app-arm64-v8a-release.apk" "apps/mobile/signtrustmap-arm64-v8a.apk"
          cp "${OUTPUT_DIR}/app-armeabi-v7a-release.apk" "apps/mobile/signtrustmap-armeabi-v7a.apk"
          cp "${OUTPUT_DIR}/app-x86_64-release.apk" "apps/mobile/signtrustmap-x86_64.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signtrustmap-apks
          path: |
            apps/mobile/signtrustmap-arm64-v8a.apk
            apps/mobile/signtrustmap-armeabi-v7a.apk
            apps/mobile/signtrustmap-x86_64.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="build-${SHORT_SHA}"
          TITLE="Build #${{ github.run_number }} (${SHORT_SHA})"
          FILES="apps/mobile/signtrustmap-arm64-v8a.apk apps/mobile/signtrustmap-armeabi-v7a.apk apps/mobile/signtrustmap-x86_64.apk"

          {
            echo "### Changes in this build"
            git log -1 --pretty=%B
            echo ""
            echo "---"
            echo "* **Commit:** ${{ github.sha }}"
            echo "* **Author:** ${{ github.actor }}"
            echo "* **Triggered by:** ${{ github.event_name }}"
            echo ""
            echo "### 📱 Downloads by Architecture"
            echo "* **[ARM64 (Most modern phones)](https://github.com/${{ github.repository }}/releases/download/${TAG}/signtrustmap-arm64-v8a.apk)**"
            echo "* **[ARMv7 (Older 32-bit phones)](https://github.com/${{ github.repository }}/releases/download/${TAG}/signtrustmap-armeabi-v7a.apk)**"
            echo "* **[x86_64 (Emulators / PC)](https://github.com/${{ github.repository }}/releases/download/${TAG}/signtrustmap-x86_64.apk)**"
          } > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file release_notes.md --title "$TITLE"
          else
            gh release create "$TAG" $FILES \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}"
          fi
