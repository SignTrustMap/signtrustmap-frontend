name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/android-apk.yml

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="signtrustmap-${SHORT_SHA}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "apps/mobile/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: apps/mobile/${{ env.APK_NAME }}
          retention-days: 14

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="build-${SHORT_SHA}"
          TITLE="Build #${{ github.run_number }} (${SHORT_SHA})"
          APK_PATH="apps/mobile/${{ env.APK_NAME }}"

          {
            echo "### Changes in this build"
            git log -1 --pretty=%B
            echo ""
            echo "---"
            echo "* **Commit:** ${{ github.sha }}"
            echo "* **Author:** ${{ github.actor }}"
            echo "* **Triggered by:** ${{ github.event_name }}"
          } > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --notes-file release_notes.md --title "$TITLE"
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}"
          fi
