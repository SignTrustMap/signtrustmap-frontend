# ==============================================================================
# SignTrustMap - Unified Nginx API Gateway Configuration
# Reference Architecture: SDD Unified API Gateway & Reverse Proxy
# ==============================================================================

# Upstream definitions (Container internal networking / local resolution)
upstream backend_service {
    server backend:3000;
    keepalive 32;
}

upstream ai_service {
    server ai-service:8000;
    keepalive 32;
}

upstream storage_service {
    server minio:9000;
    keepalive 32;
}

upstream tile_service {
    server tile-server:8080;
    keepalive 32;
}

upstream web_frontend {
    server web:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost api.signmap.site signmap.site;

    # Global proxy timeouts & buffer settings
    proxy_connect_timeout       60s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;
    send_timeout                120s;
    client_max_body_size        500M; # High-bandwidth dashcam video & chunk uploads

    # Standard security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Gateway-Proxied "signtrust-nginx-gateway" always;

    # --------------------------------------------------------------------------
    # 1. Core Backend API Gateway Route (/api/v1/*)
    # --------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://backend_service/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 2. Jetson Orin Edge AI / AIOps Gateway Route (/ai/*)
    #    Supports REST API and WebSocket/SSE telemetry stream
    # --------------------------------------------------------------------------
    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://ai_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Object Storage / Media Gateway Route (/storage/*)
    # --------------------------------------------------------------------------
    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://storage_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. Spatial Map Vector Tiles Gateway Route (/tiles/*)
    # --------------------------------------------------------------------------
    location /tiles/ {
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://tile_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 5. Default SPA Web Application
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check probe for gateway orchestrator
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
