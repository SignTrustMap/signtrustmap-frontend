services:
  api-gateway:
    image: nginx:stable-alpine
    container_name: signtrustmap-api-gateway
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3979:80"
    restart: always
